# Default width for horizontal rules
rule.width=80
# Indentation unit (here: two spaces)
indent.unit=\u0020\u0020
# Default locale (BCP 47 language tag)
locale=en
# Default box style (ASCII, UNICODE, DOUBLE, ROUNDED, HEAVY, BLOCK, MINIMAL)
box.style=UNICODE
# Whether to allow ResourceBundle fallback to JVM default locale
#   true  = normal Java fallback (may load de_DE if system default is German)
#   false = only requested locale + base messages.properties
use.fallback=true